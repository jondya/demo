name: Update Direct Rules

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Download sing-box
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_JSON="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/SagerNet/sing-box/releases/latest
          )"

          SING_BOX_URL="$(
            echo "${RELEASE_JSON}" |
              jq -r '
                [
                  .assets[]
                  | select(
                      .name
                      | test(
                          "^sing-box-[0-9].*-linux-amd64\\.tar\\.gz$"
                        )
                    )
                ]
                | .[0].browser_download_url
              '
          )"

          if [ -z "${SING_BOX_URL}" ] || [ "${SING_BOX_URL}" = "null" ]; then
            echo "Could not find sing-box linux-amd64 .tar.gz asset"
            exit 1
          fi

          echo "Downloading: ${SING_BOX_URL}"

          ARCHIVE="${RUNNER_TEMP}/sing-box.tar.gz"
          EXTRACT_DIR="${RUNNER_TEMP}/sing-box-extract"
          BIN_DIR="${RUNNER_TEMP}/sing-box-bin"

          mkdir -p "${EXTRACT_DIR}" "${BIN_DIR}"

          curl -fsSL "${SING_BOX_URL}" -o "${ARCHIVE}"
          tar -xzf "${ARCHIVE}" -C "${EXTRACT_DIR}"

          SING_BOX_BIN="$(
            find "${EXTRACT_DIR}" \
              -type f \
              -name sing-box \
              -print \
              -quit
          )"

          if [ -z "${SING_BOX_BIN}" ]; then
            echo "Could not find sing-box binary in archive"
            exit 1
          fi

          install -m 0755 \
            "${SING_BOX_BIN}" \
            "${BIN_DIR}/sing-box"

          echo "${BIN_DIR}" >> "${GITHUB_PATH}"

          "${BIN_DIR}/sing-box" version

      - name: Build rules
        run: python scripts/build_rules.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      deployments: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Delete previous deployments and workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cleanup_github_history.sh
